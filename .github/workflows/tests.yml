name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 7 (testbench 5.*) — PHP 7.2.5 - 8.0
          - php: 7.3
            laravel: 7.*
            testbench: 5.*
          - php: 8.0
            laravel: 7.*
            testbench: 5.*

          # Laravel 8 (testbench 6.*) — PHP 7.3 - 8.1
          - php: 7.4
            laravel: 8.*
            testbench: 6.*
          - php: 8.1
            laravel: 8.*
            testbench: 6.*

          # Laravel 9 (testbench 7.*) — PHP 8.0 - 8.2
          - php: 8.0
            laravel: 9.*
            testbench: 7.*
          - php: 8.2
            laravel: 9.*
            testbench: 7.*

          # Laravel 10 (testbench 8.*) — PHP 8.1 - 8.3
          - php: 8.1
            laravel: 10.*
            testbench: 8.*
          - php: 8.3
            laravel: 10.*
            testbench: 8.*

          # Laravel 11 (testbench 9.*) — PHP 8.2 - 8.3
          - php: 8.2
            laravel: 11.*
            testbench: 9.*
          - php: 8.3
            laravel: 11.*
            testbench: 9.*

          # Laravel 12 (testbench 10.*) — PHP 8.2 - 8.3
          - php: 8.2
            laravel: 12.*
            testbench: 10.*
          - php: 8.3
            laravel: 12.*
            testbench: 10.*

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
